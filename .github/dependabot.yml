version: 2

updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 5
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - pr/no-changelog
      - docker

  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 5
    groups:
      codeql:
        patterns:
          - github/codeql-action/*
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - pr/no-changelog
      - github-actions

  - package-ecosystem: "gomod"
    directories:
     - "/"
     - "/tools/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 5
      semver-patch-days: 7
      semver-minor-days: 14
      semver-major-days: 30
    groups:
      golang-x:
        patterns:
          - "golang.org/x/*"
      k8s:
        patterns:
          - "k8s.io/*"
      google-golang:
        patterns:
          - "google.golang.org/*"
      otel:
        patterns:
          - "go.opentelemetry.io/*"
      go-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # armon/go-metrics was moved to hashicorp/go-metrics, but we cannot
      # drop the indirect dependency on it just yet. This causes errors in
      # dependabot's update job, making other issues related to dependabot
      # harder to debug. These ignores can be removed once we've fully dropped
      # armon/go-metrics.
      - dependency-name: github.com/armon/go-metrics
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - pr/no-changelog
      - go

  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      react:
        patterns:
          - react
          - react-dom
      docusaurus:
        patterns:
          - "@docusaurus/*"
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 5
      semver-patch-days: 7
      semver-minor-days: 14
      semver-major-days: 30
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - pr/no-changelog
      - javascript
